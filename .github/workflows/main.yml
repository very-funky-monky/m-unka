name: Heti zeneipari állásfigyelő

on:
  schedule:
    # Szerda 05:17 UTC = 07:17 nyári / 06:17 téli időszámítás szerint (Budapest)
    - cron: "17 5 * * 3"
  workflow_dispatch:        # "Run workflow" gomb – bármikor kézzel is indítható
    inputs:
      send_email:
        description: "Küldjön e-mailt? (nem = csak előnézet készül)"
        type: choice
        options: ["igen", "nem"]
        default: "igen"

permissions:
  contents: write           # a data/seen.json visszaírásához kell

concurrency:
  group: allasfigyelo
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Állások összegyűjtése és e-mail
        env:
          BREVO_API_KEY: ${{ (github.event_name == 'schedule' || inputs.send_email == 'igen') && secrets.BREVO_API_KEY || '' }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
        run: python scout.py

      - name: Előnézet csatolása a futáshoz
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-elonezet
          path: preview.html
          if-no-files-found: ignore

      - name: Látott hirdetések mentése
        # Próbafutásnál (e-mail nélkül) nem mentünk, hogy a következő levélben is újként jelenjenek meg
        if: success() && (github.event_name == 'schedule' || inputs.send_email == 'igen')
        run: |
          git config user.name "allasfigyelo-bot"
          git config user.email "allasfigyelo-bot@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "Látott hirdetések frissítése"
          git push
