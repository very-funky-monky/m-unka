# ─────────────────────────────────────────────────────────────
#  Portálokon futtatott keresések (LinkedIn, Profession, Dreamjobs).
#  Minden találat átmegy a zenei szűrőn, úgyhogy általánosabb szó
#  (pl. rendezvényszervező) is mehet ide.
# ─────────────────────────────────────────────────────────────
search_keywords:
  - zenei
  - zeneipar
  - music
  - fesztivál
  - festival
  - koncert
  - concert
  - booking agent
  - artist manager
  - lemezkiadó
  - record label
  - promoter
  - rendezvényszervező
  - produkciós menedzser

# ─────────────────────────────────────────────────────────────
#  Zenei szűrő: egy portálon talált állás csak akkor kerül be,
#  ha a címében/cégnevében szerepel valamelyik szó, VAGY a cég
#  rajta van a fenti listán. Kisbetűvel írd; a szó elejének kell
#  egyeznie (a "zene" egyezik a "zenei", "zenekar" szóval is).
# ─────────────────────────────────────────────────────────────
music_terms:
  - zene          # zene, zenei, zenekar, zeneipar
  - könnyűzen
  - music
  - fesztivál
  - festival
  - koncert
  - concert
  - lemezkiadó
  - record label
  - a&r
  - booker
  - booking agent
  - artist manag
  - előadói menedzs
  - turné
  - tour manag
  - hangmérnök
  - sound engineer
  - live entertainment
  - koncertszervez
  - dj

# Ezeket az állásokat akkor is kihagyja, ha zenei cégnél vannak.
exclude_terms:
  - pultos
  - bartender
  - felszolgáló
  - waiter
  - hostess
  - takarító
  - cleaner
  - biztonsági őr
  - security guard
  - szakács
  - konyhai
  - raktáros
  - futár
  - árufeltöltő
  - pénztáros
  - diákmunka
  - önkéntes
  - volunteer
  - zenetanár        # zeneiskolai tanári állások
  - music teacher
  - zongoratanár
  - hegedűtanár
  - gitártanár
  - énektanár
  - korrepetitor
  - orvos
